[package]
name = "creative-suite-rust-prototype"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ffmpeg-next = "9.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sdl3 = { version = "0.20", features = ["use-vcpkg", "unsafe_textures"] }
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
