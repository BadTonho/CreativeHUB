name: Build and test

# Manual only, to keep Actions minutes under control: run it from the Actions tab
# ("Run workflow") on the branch or commit to validate, or with
# `gh workflow run ci.yml --ref <branch> -f platforms=all|windows|linux`.
# A release tag still requires a successful run of this workflow for its commit.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and test
        type: choice
        options: [all, windows, linux]
        default: all

permissions:
  contents: read

# A newer manual run of the same ref and platform choice replaces one that is still going.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # macOS is paused: no environment is available to reproduce or fix its
        # failures (the vcpkg qtbase build currently fails on `__yield`).
        # macOS remains a required product target; its validation is pending.
        # To re-enable, add `macos-latest` to both lists in the expression below.
        os: ${{ fromJSON(inputs.platforms == 'windows' && '["windows-latest"]' || inputs.platforms == 'linux' && '["ubuntu-24.04"]' || '["windows-latest","ubuntu-24.04"]') }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BASELINE: 3af1d1e60af2b2abf55760538cd607829029b07a
      # Prebuilt dependency packages (Qt, FFmpeg, ...) are restored from the Actions cache.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
      # Release-only dependency triplets (see cmake/vcpkg-triplets) halve dependency build time.
      VCPKG_TRIPLET: ${{ startsWith(matrix.os, 'windows') && 'x64-windows-release' || 'x64-linux-release' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check out the manifest's vcpkg baseline
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout "$VCPKG_BASELINE"

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_BASELINE }}-

      - name: Ensure vcpkg binary cache directory exists
        shell: bash
        run: mkdir -p vcpkg-binary-cache

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install macOS vcpkg build tools
        if: runner.os == 'macOS'
        shell: bash
        run: brew install autoconf autoconf-archive automake libtool nasm

      - name: Install Linux vcpkg and FFmpeg build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf autoconf-archive automake libtool nasm libdrm-dev libltdl-dev \
            '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev \
            libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libegl-dev xvfb openbox

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_OVERLAY_TRIPLETS=$env:GITHUB_WORKSPACE/cmake/vcpkg-triplets"
          "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET"
          -DVCPKG_MANIFEST_FEATURES=vulkan

      - name: Configure on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/cmake/vcpkg-triplets"
          -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"
          -DVCPKG_MANIFEST_FEATURES=vulkan

      # Saved even when the project build below fails, so a later run reuses the dependencies.
      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true' && hashFiles('vcpkg-binary-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake') }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test on Windows
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test on Linux
        if: runner.os == 'Linux'
        env:
          CREATIVE_SUITE_QT_QPA_PLATFORM_OVERRIDE: xcb
        run: >-
          xvfb-run -a bash -c
          'openbox & sleep 1; ctest --test-dir build -C Release -LE native-gpu --output-on-failure'

      - name: Test on macOS
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure
