name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # macOS is paused: no environment is available to reproduce or fix its
        # failures (the vcpkg qtbase build currently fails on `__yield`).
        # macOS remains a required product target; its validation is pending.
        # To re-enable, add `macos-latest` back to this list.
        os: [windows-latest, ubuntu-26.04]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BASELINE: 3af1d1e60af2b2abf55760538cd607829029b07a

    steps:
      - uses: actions/checkout@v4

      - name: Check out the manifest's vcpkg baseline
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout "$VCPKG_BASELINE"

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install macOS vcpkg build tools
        if: runner.os == 'macOS'
        shell: bash
        run: brew install autoconf autoconf-archive automake libtool nasm

      - name: Install Linux vcpkg and FFmpeg build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf autoconf-archive automake libtool nasm libdrm-dev libltdl-dev \
            '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev \
            libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libegl-dev

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_FEATURES=vulkan

      - name: Configure on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_FEATURES=vulkan

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test on Windows
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test on macOS and Linux
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure
